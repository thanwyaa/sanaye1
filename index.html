<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yalla Chemistry Live Contest</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js"
            }
        }
    </script>
</head>
<body>
    <div id="app">
        <!-- Brand -->
        <div class="brand">
            <img src="https://i.ibb.co/67wcPSGc/logo.png" alt="Yalla Chemistry" />
            <h1>مسابقة يلا كيمياء المباشرة</h1>
        </div>

        <!-- Login -->
        <div id="loginSection">
            <input type="text" id="studentName" placeholder="اكتب اسمك الثنائي" />
            <button id="joinBtn">دخول المسابقة</button>
        </div>

        <!-- Student Dashboard -->
        <div id="studentDashboard" class="hidden">
            <div id="timerDisplay">⏳ 60</div>
            <div id="questionBox">
                <h2 id="qTitle">السؤال</h2>
                <div id="optionsContainer"></div>
                <button id="submitAnswerBtn">إرسال الإجابة</button>
                <div id="feedbackMsg">في انتظار السؤال...</div>
            </div>
            <div id="leaderboard">
                <h3>🏆 الترتيب</h3>
                <div id="lbList"></div>
            </div>
        </div>

        <!-- Winner Screen -->
        <div id="winnerOverlay" class="hidden">
            <div id="confettiContainer"></div>
            <div class="winner-content">
                <div class="trophy">🏆</div>
                <div id="winnerName">الاسم</div>
                <div id="winnerScore">نقاط: 0</div>
                <div id="top10List"></div>
                <button id="resetWinnerBtn">⟲ العودة</button>
            </div>
        </div>
    </div>

    <script type="module" src="firebase.js"></script>
    <script type="module" src="student.js"></script>
</body>
</html>
